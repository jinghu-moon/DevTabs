<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>DevTabs · 配对发送演示</title>
<style>
:root{color-scheme:dark;--bg:#101513;--panel:#171e1a;--panel2:#1d2821;--line:#304036;--text:#e8f0e8;--muted:#a5b3a8;--dim:#728277;--accent:#b5dfad;--accentbg:#29402d;--warn:#e5c17b;--warnbg:#3a3020;--red:#eea5a5;--mono:"Cascadia Code",Consolas,monospace;font:14px/1.5 "Segoe UI Variable","Microsoft YaHei UI",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#26382c 0,transparent 38%),var(--bg);color:var(--text);min-width:860px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:hover{background:var(--panel2)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,textarea,select{background:#111814;border:1px solid var(--line);border-radius:6px;padding:9px 10px;outline:0}textarea{resize:vertical;min-height:150px;width:100%;line-height:1.6}.app{height:100vh;display:grid;grid-template-rows:48px 1fr 27px}.top{display:flex;align-items:center;gap:14px;padding:0 18px;background:#151b17;border-bottom:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;font-weight:650;letter-spacing:.3px}.mark{display:grid;place-items:center;width:24px;height:24px;border:1px solid #729875;border-radius:6px;color:var(--accent)}.crumb{color:var(--muted);font-size:12px}.top .spacer{margin-left:auto}.top button{padding:6px 9px;border-radius:5px;color:var(--muted);font-size:12px}.top .primary,.primary{background:var(--accent);color:#172319;border:1px solid var(--accent);font-weight:600}.body{display:grid;grid-template-columns:255px minmax(0,1fr) 295px;min-height:0}.left,.right{background:rgba(20,28,23,.95);min-height:0}.left{border-right:1px solid var(--line);padding:15px 11px;display:flex;flex-direction:column;gap:12px}.right{border-left:1px solid var(--line);padding:16px 14px;overflow:auto}.section-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:0 7px}.search{display:flex;gap:7px;align-items:center}.search input{width:100%;font-size:12px}.targets{display:flex;flex-direction:column;gap:4px;overflow:auto}.target{padding:10px 9px;text-align:left;border-radius:6px;color:var(--muted);display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;width:100%}.target.active{color:var(--text);background:var(--accentbg);box-shadow:inset 2px 0 var(--accent)}.target .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);margin-top:6px}.target.active .dot{background:var(--accent)}.target small{display:block;color:var(--dim);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.target .status{font-size:10px;color:var(--accent)}.left-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}.left-bottom button{text-align:left;color:var(--muted);padding:8px 9px;border-radius:5px;font-size:12px}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.mainhead{padding:20px 25px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}.mainhead h1{font-size:23px;margin:4px 0 0;font-weight:600}.mainhead p{color:var(--muted);font-size:12px;margin-top:5px}.mainhead .spacer{margin-left:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted);white-space:nowrap}.content{padding:20px 25px;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}.pair-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px}.pair-head{display:flex;align-items:flex-start;gap:10px}.app-icon{width:30px;height:30px;border:1px solid #49624d;border-radius:7px;display:grid;place-items:center;color:var(--accent);font-family:var(--mono)}.pair-head h2{font-size:16px;margin:0}.pair-head p{font-size:11px;color:var(--muted);margin-top:3px}.pair-head .spacer{margin-left:auto}.connection{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:11px;margin-top:15px;padding:8px 10px;background:#1d2a20;border-radius:5px}.connection .dot{width:6px;height:6px;background:currentColor;border-radius:50%}.compose{display:flex;flex-direction:column;gap:10px}.compose-label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.compose-label span:last-child{color:var(--dim);font-size:11px}.compose textarea{background:#121914}.compose-actions{display:flex;align-items:center;gap:8px}.compose-actions .spacer{margin-left:auto}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font:10px var(--mono);background:#141b16}.chip button{color:var(--dim);margin-left:4px}.notice{padding:10px 12px;border-left:2px solid var(--warn);background:var(--warnbg);color:#e8d4a6;font-size:12px;line-height:1.65}.history{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.history-head{display:flex;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}.history-head h2{font-size:13px;margin:0}.history-head .spacer{margin-left:auto}.history-row{display:grid;grid-template-columns:82px minmax(0,1fr) 90px;gap:10px;align-items:start;padding:12px 14px;border-bottom:1px solid #27332b;font-size:12px}.history-row:last-child{border-bottom:0}.history-row time{color:var(--dim);font-size:11px}.history-row p{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sent{color:var(--accent);font-size:11px}.queued{color:var(--warn);font-size:11px}.right h2{font-size:14px;margin:0}.right-head{display:flex;align-items:center;justify-content:space-between}.right p{color:var(--muted);font-size:12px;margin:5px 0 16px}.info{border-top:1px solid var(--line);padding:14px 0}.info h3{font-size:12px;margin:0 0 9px}.info-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:11px}.info-row span{color:var(--dim)}.info-row b{font-weight:400;text-align:right;overflow-wrap:anywhere}.how{display:flex;flex-direction:column;gap:9px}.how-step{display:grid;grid-template-columns:21px 1fr;gap:8px;font-size:11px;color:var(--muted)}.how-step b{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--accentbg);color:var(--accent);font-size:10px}.right .warning{margin-top:14px;padding:10px;border:1px solid #5a4a2f;background:var(--warnbg);border-radius:5px;color:#dfc790;font-size:11px;line-height:1.6}.bottom{display:flex;align-items:center;gap:15px;padding:0 14px;background:#141b16;border-top:1px solid var(--line);color:var(--dim);font-size:10px}.bottom .live{color:var(--accent)}.bottom .spacer{margin-left:auto}.modal-bg{position:fixed;inset:0;display:grid;place-items:center;background:#07100bc2;backdrop-filter:blur(5px);z-index:20}.modal{width:min(490px,calc(100vw - 32px));background:#1a241d;border:1px solid #506352;border-radius:9px;box-shadow:0 24px 90px #0008;overflow:hidden}.modal-head{padding:20px 21px 12px;display:flex;gap:10px}.modal-head h2{font-size:18px;margin:0}.modal-head p{font-size:12px;color:var(--muted);margin-top:5px}.modal-body{padding:4px 21px 19px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 21px;border-top:1px solid var(--line);background:#172019}.modal .field{display:block;color:var(--muted);font-size:12px;margin-top:12px}.modal .field input,.modal .field select{display:block;width:100%;margin-top:6px}.modal .help{font-size:11px;color:var(--dim);line-height:1.7;margin-top:13px}.toast{position:fixed;left:50%;bottom:41px;transform:translateX(-50%);background:#d9ead9;color:#172318;padding:9px 14px;border-radius:6px;z-index:40;font-size:12px;box-shadow:0 8px 25px #0007}.hidden{display:none!important}@media(max-width:1120px){body{min-width:700px}.body{grid-template-columns:210px minmax(0,1fr)}.right{display:none}}@media(max-width:760px){body{min-width:0}.body{grid-template-columns:1fr}.left{display:none}.top{padding:0 11px}.top .path,.top .help-btn{display:none}.content,.mainhead{padding-left:15px;padding-right:15px}}
</style>
</head>
<body>
<div class="app" id="app"></div><div id="overlay"></div><div id="live" aria-live="polite"></div>
<script>
'use strict';
const state={target:'codex-new',query:'',mode:'send',draft:'',queue:[],history:[]};
const targets=[
 {id:'codex-new',software:'OpenAI Codex',short:'C',scope:'new-project · 主线任务',input:'Codex 当前输入区域',hint:'发送到 new-project 的 Codex 对话'},
 {id:'claude-yue',software:'Claude Code',short:'A',scope:'Yue-GPUI-Component · 组件任务',input:'Claude Code 当前输入区域',hint:'发送到组件库任务'},
 {id:'powershell-debug',software:'PowerShell',short:'PS',scope:'new-project · 指定输入区域',input:'PowerShell 输入区域',hint:'发送 PowerShell 命令或文字'},
 {id:'vscode-notes',software:'VS Code',short:'VS',scope:'设计笔记 · 编辑器输入区域',input:'VS Code 命令输入区域',hint:'发送到指定编辑器入口'}
];
const active=()=>targets.find(t=>t.id===state.target)||targets[0];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{clearTimeout(toast.t);document.querySelector('#live').innerHTML=`<div class="toast">${esc(t)}</div>`;toast.t=setTimeout(()=>document.querySelector('#live').innerHTML='',2800)};
function render(){const t=active();document.querySelector('#app').innerHTML=`<header class="top"><button class="brand" data-action="home" title="DevTabs 配对发送"><span class="mark">↔</span>DevTabs</button><span class="crumb">配对发送工作台</span><span class="spacer"></span><button data-action="pair">＋ 管理配对</button><button data-action="help">? 帮助</button></header><div class="body"><aside class="left"><div class="section-label">已配对的软件</div><label class="search">⌕<input id="target-search" value="${esc(state.query)}" placeholder="搜索软件或范围" aria-label="搜索软件或范围"></label><div class="targets">${targets.filter(t=>(t.software+' '+t.scope).toLowerCase().includes(state.query.toLowerCase())).map(x=>`<button class="target ${x.id===state.target?'active':''}" data-action="select" data-id="${x.id}"><span class="dot"></span><span><b>${esc(x.software)}</b><small>${esc(x.scope)}</small></span><span class="status">${x.id===state.target?'当前':''}</span></button>`).join('')||'<span class="dim small">没有匹配的配对。</span>'}</div><div class="left-bottom"><button data-action="pair">＋ 新增配对</button><button data-action="settings">⚙ 配对设置</button></div></aside><main class="main"><section class="mainhead"><div><div class="eyebrow">PAIRING WORKSPACE</div><h1>发送到指定软件</h1><p>只负责找到目标输入区域并发送文字。目标软件负责终端、Agent、文件和执行结果。</p></div><span class="spacer"></span><button class="btn" data-action="clear">清空草稿</button></section><section class="content"><article class="pair-card"><header class="pair-head"><span class="app-icon">${esc(t.short)}</span><div><h2>${esc(t.software)}</h2><p>${esc(t.scope)}</p></div><span class="spacer"></span><button class="btn" data-action="change">切换目标</button></header><div class="connection"><span class="dot"></span><span>已配对 · ${esc(t.input)}</span></div></article><article class="pair-card compose"><div class="compose-label"><span>发送内容</span><span>目标：${esc(t.software)} · ${esc(t.scope)}</span></div><textarea id="draft" placeholder="写下要发送给目标软件的文字…">${esc(state.draft)}</textarea><div class="chips"><button class="chip" data-action="insert" data-text="当前项目路径">＋ 插入项目路径</button><button class="chip" data-action="insert" data-text="当前文件路径">＋ 插入文件路径</button><button class="chip" data-action="insert" data-text="下一步任务">＋ 插入下一步任务</button></div><div class="compose-actions"><span class="dim small">Ctrl+Enter 发送 · Enter 换行</span><span class="spacer"></span><button class="btn" data-action="queue">加入发送队列</button><button class="btn primary" data-action="send">发送到 ${esc(t.software)} ↵</button></div></article><div class="notice">DevTabs 不读取目标软件内部内容，也不判断 Agent 是否完成。发送成功只表示文字已交给配对的输入区域。</div><article class="history"><header class="history-head"><h2>发送记录</h2><button class="btn spacer" data-action="clear-history">清空记录</button></header>${state.history.length?state.history.slice().reverse().map(h=>`<div class="history-row"><time>${esc(h.time)}</time><p title="${esc(h.text)}">${esc(h.text)}</p><span class="${h.kind==='queued'?'queued':'sent'}">${h.kind==='queued'?'已加入队列':'已发送'}</span></div>`).join(''):'<div class="history-row"><time>—</time><p class="dim">发送后，这里只记录目标、时间和文字摘要。</p><span class="dim">暂无记录</span></div>'}</article></section></main><aside class="right"><header class="right-head"><h2>当前配对</h2><button class="btn" data-action="pair">编辑</button></header><p>${esc(t.software)} · ${esc(t.scope)}</p><section class="info"><h3>发送目标</h3><div class="info-row"><span>软件</span><b>${esc(t.software)}</b></div><div class="info-row"><span>输入区域</span><b>${esc(t.input)}</b></div><div class="info-row"><span>连接状态</span><b style="color:var(--accent)">已连接</b></div></section><section class="info"><h3>使用逻辑</h3><div class="how"><div class="how-step"><b>1</b><span>选择一个已经配对的软件和具体范围。</span></div><div class="how-step"><b>2</b><span>编辑要发送的文字，可插入路径或模板。</span></div><div class="how-step"><b>3</b><span>显式发送；目标软件接管后续处理。</span></div></div></section><div class="warning">配对失效时只提示“无法发送”，不会伪造成功，也不会替用户操作目标软件。</div></aside></div><footer class="bottom"><span class="live">● 配对服务就绪</span><span>目标软件自行负责运行状态</span><span class="spacer">Ctrl+K 配对 · Ctrl+Enter 发送</span></footer>`}
function modal(title,sub,body,foot=''){document.querySelector('#overlay').innerHTML=`<div class="modal-bg" data-close="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><div><h2 id="dialog-title">${esc(title)}</h2><p>${esc(sub)}</p></div><span class="spacer"></span><button class="btn" data-action="close">×</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;document.querySelector('#overlay input, #overlay select, #overlay button')?.focus()}
function close(){document.querySelector('#overlay').innerHTML=''}
const actions={home:()=>{state.query='';render()},select:e=>{state.target=e.dataset.id;state.draft='';render()},change:()=>modal('切换发送目标','选择另一个已经建立的配对。',targets.map(t=>`<button class="target ${t.id===state.target?'active':''}" data-action="select-close" data-id="${t.id}"><span class="dot"></span><span><b>${esc(t.software)}</b><small>${esc(t.scope)}</small></span></button>`).join('')),
'select-close':e=>{state.target=e.dataset.id;state.draft='';close();render()},pair:()=>modal('管理配对','把 DevTabs 连接到目标软件的明确输入区域。',`<label class="field">软件名称<input id="pair-name" placeholder="例如：OpenAI Codex"></label><label class="field">目标范围<input id="pair-scope" placeholder="例如：new-project · 主线任务"></label><label class="field">输入区域<select><option>当前窗口的输入区域</option><option>指定窗口 / 标签页输入区域</option><option>通过本地连接器选择</option></select></label><p class="help">正式版只保存配对身份和连接器信息。它不接管目标软件的终端渲染、Agent 状态、文件读写或结果判断。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-pair">保存配对</button>`),
'save-pair':()=>{const n=document.querySelector('#pair-name').value.trim()||'未命名软件';const s=document.querySelector('#pair-scope').value.trim()||'指定输入区域';const id='pair-'+Date.now();targets.push({id,software:n,short:n.slice(0,2).toUpperCase(),scope:s,input:'指定输入区域',hint:'发送到 '+s});state.target=id;state.draft='';close();render();toast('已保存配对：'+n)},
send:()=>{const text=document.querySelector('#draft').value.trim();if(!text){toast('请先写下要发送的文字。');document.querySelector('#draft').focus();return}state.history.push({time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text,kind:'sent'});state.draft='';render();toast('文字已发送到 '+active().software+' 的输入区域。')},queue:()=>{const text=document.querySelector('#draft').value.trim();if(!text){toast('请先写下要排队的文字。');return}state.history.push({time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text,kind:'queued'});state.draft='';render();toast('已加入发送队列，等待目标输入区域可用。')},insert:e=>{const text=e.dataset.text;const area=document.querySelector('#draft');const value=area.value;area.value=value+(value?'\n':'')+'['+text+']';state.draft=area.value;area.focus()},clear:()=>{state.draft='';render();toast('草稿已清空。')},'clear-history':()=>{state.history=[];render()},settings:()=>modal('配对设置','只管理发送边界。',`<label class="field">发送失败后的重试次数<select><option>不自动重试</option><option>最多重试 1 次</option></select></label><label class="field">发送前确认<select><option>长文本发送前确认</option><option>始终直接发送</option></select></label><p class="help">不会根据目标软件的静默、窗口标题或聊天文本猜测任务完成状态。</p>`,`<button class="btn primary" data-action="close">完成</button>`),help:()=>modal('DevTabs 负责配对','目标软件负责工作。',`<p class="help">DevTabs 只解决三个问题：目标是谁、文字发到哪里、发送是否成功。</p><p class="help">目标软件里的终端、Agent、Debug、文件树、Markdown、差异、任务状态和系统通知都属于目标软件。DevTabs 不复制这些能力。</p>`,`<button class="btn primary" data-action="close">明白</button>`),close};
 document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){actions[a.dataset.action]?.(a);return}if(e.target.dataset.close)close()});
document.addEventListener('input',e=>{if(e.target.id==='draft')state.draft=e.target.value;if(e.target.id==='target-search'){state.query=e.target.value;render();document.querySelector('#target-search')?.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();actions.send()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();actions.pair()}});
render();
</script>
</body>
</html>
